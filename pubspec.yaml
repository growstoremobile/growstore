name: growstore
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  google_sign_in: ^6.3.0
  firebase_auth: ^6.5.1
  flutter_facebook_auth: ^7.1.6
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  get_it: ^9.2.1
  flutter_rating_bar: ^4.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.1.0
  supabase_flutter: ^2.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: 2.4.13
  mobx_codegen: ^2.7.0
  flutter_lints: ^6.0.0


flutter:

  
  uses-material-design: true

 
  assets:
    - assets/images/

  fonts:
      - family: Inter
        fonts:
          - asset: assets/fonts/Inter-Regular.ttf
          - asset: assets/fonts/Inter-Bold.ttf
            weight: 700
      - family: Syne
        fonts:
          - asset: assets/fonts/Syne-Regular.ttf
          - asset: assets/fonts/Syne-Bold.ttf
            weight: 700
